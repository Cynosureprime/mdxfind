# cl2metal overlay for keccak224 (gpu/gpu_keccak224_core.cl -> gpu/metal_keccak224_core.metal).
#
# Phase 2d.7b Keccak/SHA-3 sponge family fan-out. Sibling of keccak256
# (canary). 7-uint32 LE digest. Shares keccakf1600 + MTL_KECCAK_RC +
# MTL_KECCAK_ROTC in metal_common.metal rev 1.18+ with the other 7 sponge
# ops. Per-algo distinguishers (rate + domain-pad + output bytes) are baked
# into the per-core .cl source via #define -- no overlay change required.
#
# Translator support (cl2metal.py rev 1.7):
#
#   - keccakf1600 in metal_common.metal: no _BLOCK_HELPERS_* registration.
#   - KECCAK_RC -> MTL_KECCAK_RC + KECCAK_ROTC -> MTL_KECCAK_ROTC in 1:1
#     substitution table.
#   - dual_addr_space_helpers (Phase 2d.7b NEW): keccak224_absorb_full and
#     keccak224_absorb_pad emit dual thread/device overloads. Same pattern as
#     keccak256 canary.

algo: keccak224

# Text-anchored, so it cannot drift. This replaced a positional
# skip_line_ranges entry on 2026-10-05. Matching is on the macro name
# with a lookahead, so template_emit_hit_or_overflow (the form the
# template actually calls) is NOT caught by it, and a rename or removal
# of the macro in the .cl is a hard error rather than a silent miss.
skip_macros:
  - template_emit_hit

arg_address_space:
  template_finalize:
    data: "device const"

dual_addr_space_helpers:
  - name: keccak224_absorb_full
    arg: data
  - name: keccak224_absorb_pad
    arg: data
