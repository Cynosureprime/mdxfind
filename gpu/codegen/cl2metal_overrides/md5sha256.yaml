# cl2metal overlay for md5sha256 (gpu/gpu_md5sha256_core.cl ->
# gpu/metal_md5sha256_core.metal).
#
# e179 JOB_MD5SHA256 = md5(hex64(sha256(p))), then iterated MD5 on the
# 32-byte hex of the previous round.  Composite core, so it touches two
# Metal primitives rather than one: md5_block AND sha256_block.  Both
# already exist in metal_common.metal (md5_block at line 617,
# sha256_block at line 899), and both are named identically to their
# gpu_common.cl twins, which is what the token discipline in
# feedback_base_algo_token_match.md requires -- so no companion edit to
# metal_common.metal is needed for this core.
#
# NOT used, deliberately: md5_block_pad64.  gpu_common.cl carries a
# hand-folded all-constant version of this core's second MD5 block, but
# metal_common.metal has no twin for it.  The OpenCL core builds that
# block explicitly so one source translates to both backends losslessly.
# Taking the specialization means adding the Metal twin first and
# measuring it; see the header of the .cl.
#
# Apple-specific tweaks:
#
#   1. arg_address_space: template_finalize.data -> "device const".
#      The OpenCL source leaves `data` unqualified (so __private); the
#      Metal call site in metal_template.metal passes the per-lane
#      buf_scratch_pool slice as a `device uchar *`, so the translator's
#      default `thread const uchar *data` inference will not compile.
#      Same pattern as md5.yaml / md5raw.yaml / sha256.yaml / sql5.yaml.
#
#   2. skip_macros: template_emit_hit.  The Metal port keeps only the
#      template_emit_hit_or_overflow form, which is the one the template
#      actually calls.  Text-anchored on the macro name, so a rename or
#      removal in the .cl is a hard error rather than a silent miss.

algo: md5sha256

skip_macros:
  - template_emit_hit

arg_address_space:
  template_finalize:
    data: "device const"
