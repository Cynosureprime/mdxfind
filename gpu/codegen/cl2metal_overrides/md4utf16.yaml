# cl2metal overlay for md4utf16 (gpu/gpu_md4utf16_core.cl -> gpu/metal_md4utf16_core.metal).
#
# Phase 2d.2.2 md4utf16 overlay. Mirrors the md4 pattern (md4.yaml) with the
# task #250 arg_address_space tweak for template_finalize. Reason:
# the kernel call site in metal_template.metal passes `device uchar *buf`
# (per-lane scratch slice from the buf_scratch_pool MTLBuffer). Per
# task #250 the per-lane buf is in device storage to keep the M2 Max PSO
# register budget within bounds, so the helper signature must take
# `device const uchar *data` rather than the translator's default
# `thread const uchar *data` inference. Same pattern as md4.yaml /
# md5salt.yaml.
#
# The OpenCL source declares `data` as unqualified pointer (defaults to
# __private). The Metal call site passes a device buf, so the helper
# signature MUST be `device const uchar *data`.

algo: md4utf16

# Text-anchored, so it cannot drift. The previous form was a positional
# skip_line_ranges, which had already had to be re-aimed once (262-265 ->
# 373-376 on 2026-09-15 when md4_over_utf16le was inserted above it) and had
# drifted again by 2026-10-05: 373-376 had come to cover the whole body of
# template_finalize plus its closing brace. Deleting that brace left the
# function open, rewrite_functions bailed out and appended the remainder of
# the file UNTRANSLATED, and cl2metal still exited 0.
skip_macros:
  # Replaced by template_emit_hit_or_overflow in the Metal port. Matching is
  # on the macro name with a lookahead, so template_emit_hit_or_overflow is
  # not caught by it, and a rename or removal in the .cl is a hard error
  # rather than a silent miss.
  - template_emit_hit

arg_address_space:
  template_finalize:
    data: "device const"
  # md4_over_utf16le reads the candidate straight out of the packed word
  # buffer, which is a device pointer.  Without this the translator emits
  # `thread const uchar *data` and the call site will not compile.
  md4_over_utf16le:
    data: "device const"
