# cl2metal overlay for sha512saltpass (gpu/gpu_sha512saltpass_core.cl ->
# gpu/metal_sha512saltpass_core.metal).
#
# Phase 2d.5.6 sha512saltpass -- SHA-512(salt || pass), PREPEND-shape salted
# SHA-512. Sibling of sha512passsalt (Phase 2d.5.5, APPEND): same compression
# block (sha512_block), same SHA-512 IVs, same EMIT_HIT_16, same 4 SALTED
# PSO variants. Only the salt POSITION at template_finalize time differs
# (PREPEND vs APPEND). Hit-replay decode width forward-staged in
# metal_gpu_hash_words switch (case JOB_SHA512SALTPASS: 16). is_salted_op
# widened to admit JOB_SHA512SALTPASS in companion gpujob_metal.m edit.
#
# Reuses the entire SHA-512 infrastructure (sha512_block + bswap64 + rotr64
# + EMIT_HIT_16) added in Phase 2d.5.1. No new metal_common.metal additions.
#
# Two Apple-specific tweaks (identical pattern to sha512passsalt.yaml):
#
#   1. arg_address_space: template_finalize.data -> "device const"
#      (task #250 pattern shared with every prior SHA/MD core overlay).
#
#   2. skip_line_ranges: simple template_emit_hit macro
#      OpenCL source lines 971-976 (3-line comment header + 3-line macro).
#      The Metal hand-port keeps only the template_emit_hit_or_overflow
#      dedup variant.
#
# Source order at JIT compile time (mirrors sha512passsalt):
#   metal_common_str + metal_sha512saltpass_core_str + [metal_md5_rules_str
#   if rules] + metal_template_str

algo: sha512saltpass

skip_line_ranges:
  - start: 971
    end:   976
    reason: "template_emit_hit (simple) macro -- replaced by template_emit_hit_or_overflow"

arg_address_space:
  template_finalize:
    data: "device const"
